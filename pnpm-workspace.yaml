# Supply-chain policy (see PLAN.md, "Tooling and supply chain security").
# Don't install package versions published in the last 3 days (value is minutes); fail instead of silently exempting.
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true
# Dependencies may not run install scripts. Nothing needs one today (sharp ships prebuilt binaries);
# if a package ever does, allowlist it explicitly after reviewing it.
ignoreScripts: true

# Reviewed exceptions for `pnpm audit` (re-check when @capacitor/cli updates):
# GHSA-w5hq-g745-h8pq: uuid <11.1.1 reached via @capacitor/cli > xcode (iOS project helper). Build-time tool on the
# developer machine only, never shipped in the app, and we don't target iOS.
auditConfig:
  ignoreGhsas:
    - GHSA-w5hq-g745-h8pq
